name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least-privilege GITHUB_TOKEN: these jobs only read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
        db:
          - { name: baseline, mysql: 'mysql:9.7', mariadb: 'mariadb:11.4', postgres: 'postgres:18' }
          - { name: min,      mysql: 'mysql:8.4', mariadb: 'mariadb:10.11', postgres: 'postgres:15' }
          - { name: lts,      mysql: 'mysql:8.4', mariadb: 'mariadb:11.8', postgres: 'postgres:16' }
          - { name: rolling,  mysql: 'mysql:9.7', mariadb: 'mariadb:12.3', postgres: 'postgres:17' }

    services:
      mysql:
        image: ${{ matrix.db.mysql }}
        env:
          MYSQL_USER: phpar
          MYSQL_PASSWORD: secret
          MYSQL_DATABASE: phpar_test
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=10
      mariadb:
        image: ${{ matrix.db.mariadb }}
        env:
          MARIADB_USER: phpar
          MARIADB_PASSWORD: secret
          MARIADB_DATABASE: phpar_test
          MARIADB_ROOT_PASSWORD: secret
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
      postgres:
        image: ${{ matrix.db.postgres }}
        env:
          POSTGRES_DB: phpar_test
          POSTGRES_USER: phpar
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U phpar"
          --health-interval=5s --health-timeout=5s --health-retries=10
      memcached:
        image: memcached:1.6
        ports: ['11211:11211']
        options: >-
          --health-cmd="timeout 5 bash -c '</dev/tcp/127.0.0.1/11211'"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      PHPAR_MYSQL: mysql://phpar:secret@127.0.0.1:3306/phpar_test
      PHPAR_MARIADB: mysql://phpar:secret@127.0.0.1:3307/phpar_test
      PHPAR_PGSQL: pgsql://phpar:secret@127.0.0.1:5432/phpar_test
      PHPAR_SQLITE: sqlite://test.db
      PHPAR_MEMCACHED: 127.0.0.1
      PHPAR_REDIS: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, memcached
          coverage: pcov

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Static analysis
        if: matrix.php-version == '8.3' && matrix.db.name == 'baseline'
        run: composer run analyse

      - name: Coding style
        if: matrix.php-version == '8.3' && matrix.db.name == 'baseline'
        run: composer run cs

      - name: Tests (mysql)
        run: PHPAR_CONNECTION=mysql composer run test -- --coverage-clover coverage.xml

      - name: Tests (mariadb)
        run: PHPAR_CONNECTION=mariadb composer run test

      - name: Tests (sqlite)
        run: PHPAR_CONNECTION=sqlite composer run test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-php${{ matrix.php-version }}-${{ matrix.db.name }}
          path: coverage.xml

  redis-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis-image:
          - redis:6
          - redis:7
          - redis:8
          - valkey/valkey:7
          - valkey/valkey:8
          - valkey/valkey:9

    services:
      redis:
        image: ${{ matrix.redis-image }}
        ports: ['6379:6379']

    env:
      PHPAR_REDIS: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Redis did not become ready" >&2
          exit 1

      - name: Redis adapter tests
        run: vendor/bin/phpunit --filter RedisCacheTest --fail-on-risky --fail-on-warning --fail-on-skipped --fail-on-deprecation

  coverage-badge:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download baseline coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-php8.3-baseline

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Generate coverage badge SVG
        run: |
          php -r '
          $x = simplexml_load_file("coverage.xml");
          $n = $x->xpath("//project/metrics");
          if ($n === false || !isset($n[0])) { fwrite(STDERR, "no coverage metrics found in clover\n"); exit(1); }
          $m = $n[0];
          $s = (int) $m["statements"];
          $c = (int) $m["coveredstatements"];
          $pct = $s > 0 ? (int) round($c / $s * 100) : 0;
          $color = $pct >= 90 ? "#4c1" : ($pct >= 80 ? "#97ca00" : ($pct >= 50 ? "#dfb317" : "#e05d44"));
          $label = "coverage"; $value = $pct . "%";
          $lw = 6 * strlen($label) + 10; $vw = 7 * strlen($value) + 10; $w = $lw + $vw;
          $svg = sprintf(
            "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"%d\" height=\"20\" role=\"img\" aria-label=\"%s: %s\">".
            "<rect rx=\"3\" width=\"%d\" height=\"20\" fill=\"#555\"/>".
            "<rect rx=\"3\" x=\"%d\" width=\"%d\" height=\"20\" fill=\"%s\"/>".
            "<g fill=\"#fff\" text-anchor=\"middle\" font-family=\"Verdana,Geneva,sans-serif\" font-size=\"11\">".
            "<text x=\"%d\" y=\"14\">%s</text><text x=\"%d\" y=\"14\">%s</text></g></svg>",
            $w, $label, $value, $w, $lw, $vw, $color, (int) ($lw / 2), $label, (int) ($lw + $vw / 2), $value
          );
          @mkdir("out");
          file_put_contents("out/coverage.svg", $svg);
          fwrite(STDERR, "coverage={$pct}%\n");
          '

      - name: Publish to orphan badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git checkout -q -b badges
          git add coverage.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore: update coverage badge [skip ci]"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
